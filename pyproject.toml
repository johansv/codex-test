[project]
name = "agentlab"
version = "0.1.0"
description = "AgentLab experimentation workspace."
authors = [{ name = "AgentLab Contributors" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "garminconnect==0.2.30",
    "tzdata>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "coverage[toml]>=7.4",
    "ruff>=0.3.0",
]

[project.scripts]
agentlab-capture = "reqflow.cli.capture:main"
agentlab-req = "reqflow.cli.requirements:main"
agentlab-dev = "reqflow.cli.dev:main"
agentlab-worker = "agentlab.cli.worker:main"
agentlab-mark-done = "reqflow.cli.mark_done:main"
agentlab-start = "reqflow.cli.start:main"
agentlab-amend = "reqflow.cli.amend:main"
agentlab-bulk-amend = "reqflow.cli.bulk_amend:main"
agentlab-batch = "reqflow.cli.batch:main"
agentlab-review = "reqflow.cli.review:main"
agentlab-start-nf = "reqflow.cli.start_nonfunctional:main"
agentlab-mark-done-nf = "reqflow.cli.mark_done_nonfunctional:main"
agentlab-slice = "reqflow.cli.slice:main"
agentlab-doc-refactor = "reqflow.cli.doc_refactor:main"
reqflow-capture = "reqflow.cli.capture:main"
reqflow-req = "reqflow.cli.requirements:main"
reqflow-dev = "reqflow.cli.dev:main"
reqflow-mark-done = "reqflow.cli.mark_done:main"
reqflow-mark-done-nf = "reqflow.cli.mark_done_nonfunctional:main"
reqflow-start = "reqflow.cli.start:main"
reqflow-start-nf = "reqflow.cli.start_nonfunctional:main"
reqflow-amend = "reqflow.cli.amend:main"
reqflow-bulk-amend = "reqflow.cli.bulk_amend:main"
reqflow-batch = "reqflow.cli.batch:main"
reqflow-review = "reqflow.cli.review:main"
reqflow-slice = "reqflow.cli.slice:main"
reqflow-doc-refactor = "reqflow.cli.doc_refactor:main"
agentlab-garmin-fetch = "agentlab.cli.garmin_fetch:main"
agentlab-withings-fetch = "agentlab.cli.withings_fetch:main"

[tool.uv]
package = true

[tool.uv.sources]
agentlab = { path = "src" }
reqflow = { path = "src" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["agentlab", "reqflow"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"


